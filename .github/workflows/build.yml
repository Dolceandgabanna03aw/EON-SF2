name: build

# The point of this workflow is the macOS/Linux pair. A local "it builds" only
# ever means "it builds here": every cross-platform defect fixed in this repo so
# far was invisible on the platform it was written on.
#
# Pull requests cover branch work; the push trigger is narrowed to main so a
# branch with an open PR is not built twice for the same commit.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms always report. A failure on one is a result, not a
      # reason to cancel the other.
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-24.04 }
          - { name: macos-clang, os: macos-14 }

    steps:
      - uses: actions/checkout@v4

      # JUCE needs ALSA and the X libraries on Linux. Deliberately not
      # installing webkit or curl: the plugin sets JUCE_WEB_BROWSER=0 and
      # JUCE_USE_CURL=0, so CMake only warns about them and carries on.
      #
      # Two that are easy to miss and only bite at compile time:
      #  - fontconfig: JUCE probes freetype2 and fontconfig in a single
      #    pkg-config call, so a missing fontconfig drops the freetype include
      #    path too and juceaide fails on ft2build.h.
      #  - libxi: juce_gui_basics includes X11/extensions/XInput2.h outright.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libxi-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # Runs first because it is seconds, not minutes: x10_dsp, instrument and
      # sf2 are JUCE-free by design, so a failure here is a real one and not a
      # JUCE fetch that went wrong.
      - name: Core libraries
        run: |
          cmake --preset dev
          cmake --build build
          ctest --preset dev

      - name: Plugin
        run: |
          cmake --preset plugin
          cmake --build build-plugin
          ctest --preset plugin

# Note on the two SF2 playback tests: they need a real third-party bank, and
# the corpus lives outside the repository, so on a runner they skip cleanly and
# report as passing. Their coverage is local-only until a bank is provided.

  # Loop-wrap style bugs do not fail an ordinary build: the bad index is read,
  # garbage comes back finite, and the assertions pass. They only have teeth
  # under a sanitizer, so without this job the tests are decorative.
  #
  # Linux only, to keep this to one extra build rather than two.
  sanitizer:
    name: linux-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libxi-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      # Hand-rolled rather than `--preset asan`: that preset is ASan+UBSan in a
      # Debug build with plugins off, and this job wants UBSan alone over the
      # plugin targets too. Worth revisiting if the two ever converge.
      - name: Build and test under UBSan
        run: |
          cmake -S . -B build-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DX10_BUILD_PLUGINS=ON -DX10_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"
          cmake --build build-ubsan
          ctest --test-dir build-ubsan --output-on-failure
